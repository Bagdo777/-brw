<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Raleway:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="photo-wrap">
        <img class="photo" src="სურათი.png" alt="Portrait" />
      </div>

      <div class="card-frame">
        <div class="card">
          <h1>
            <span class="light">We change<br />the world</span><br />
            <span class="dark">one eyebrow<br />at a time</span>
          </h1>
          <a class="cta" href="#book">
            Book an Appointment
            <svg viewBox="0 0 28 14" aria-hidden="true">
              <path d="M0 7h27M21 1l6 6-6 6" />
            </svg>
          </a>
        </div>
      </div>

      <div class="social" aria-label="Social">
        <i class="fa-brands fa-square-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
      </div>

      <button class="chat" aria-label="Chat">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 3C6.500 3 2 6.600 2 11c0 2.300 1.200 4.300 3.200 5.800L4 21l4.500-2.200c1.100.3 2.300.4 3.500.4 5.500 0 10-3.600 10-8S17.500 3 12 3z"
          />
        </svg>
      </button>
    </section>
  </body>
</html>
